group 'com.rouninlabs.another_brother'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
        //jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        //jcenter()
        maven {
            //url "https://rouninlabs.jfrog.io/artifactory/rounin-libs-external/"
            url "https://artifacts.rouninlabs.com/rounin-libs-external/"
        }
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.rouninlabs.another_brother"
    compileSdkVersion 34

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 19 // Bumped up because of Type B SDK
        consumerProguardFiles 'consumer-rules.pro'
        // NDK r28+ required for Android 16KB page size (Google Play requirement for API 35+)
        ndkVersion "28.0.12433518"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    lintOptions {
        checkReleaseBuilds false
        //If you want to continue even if errors found use following line
        abortOnError false
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
    implementation 'com.github.johnvuko:BrotherPrintLibrary:4.13.1'
    implementation 'com.brother.typeb:print:1.0.0'
}
